<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Alex's Album Picks — Best Albums of the Year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Bebas+Neue&family=DM+Mono:wght@300;400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="best-of-year.css?v=fdf8663fd5">
</head>
<body>
  <div class="year-page">
    <header class="year-hero">
      <!-- The "← Back to timeline" link lived here. The timeline is not part of the published
           site any more, so there is nothing to go back to: this page is the site's root. -->
      <div class="hero-kicker">Alex's Album Picks</div>
      <h1 id="year-title">Best Albums of the Year</h1>
      <p class="hero-dek" id="year-dek"></p>
      <div class="hero-actions edit-only">
        <button class="hero-edit-toggle" id="year-edit-toggle" type="button">Edit ranking</button>
        <button class="hero-add-btn" id="year-add-btn" type="button">+ Album</button>
        <button class="hero-add-btn" id="year-save-btn" type="button" title="Download bestof-data.js" style="color:rgba(60,140,100,0.85)">⬇ bestof-data.js</button>
      </div>
    </header>

    <nav class="year-nav" id="year-nav" aria-label="Browse years"></nav>

    <main class="year-main">
      <section class="year-list" id="year-list"></section>
      <aside class="year-sidebar">
        <div class="sidebar-card">
          <div class="sidebar-label">How this ranking works</div>
          <p id="ranking-note"></p>
        </div>
        <!-- A "Jump back / Return to the full timeline" card sat here. Removed with the timeline.
             If the timeline is ever published again, restore both this and the hero back-link,
             and the `timeline-link` href assignment in best-of-year.js that fed it. -->
      </aside>
    </main>
  </div>

  <div id="mini-player">
    <div id="mini-player-bar">
      <span style="font-size:12px;color:#1db954;flex-shrink:0">♪</span>
      <div id="mini-player-title"></div>
      <button id="mini-player-close" type="button" title="Close">✕</button>
    </div>
    <iframe id="mini-player-iframe" src="" height="80"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      style="width:100%;display:block;border:none"></iframe>
    <audio id="mini-player-audio" controls
      style="width:100%;display:none;background:#121212;height:44px;outline:none"></audio>
  </div>

  <!-- Add / edit album modal -->
  <div id="add-album-overlay" class="add-album-overlay" style="display:none"></div>
  <div id="add-album-panel" class="add-album-panel" style="display:none">
    <div class="aap-header">
      <div class="aap-title" id="aap-title">Add album</div>
      <button class="aap-close" id="aap-close" type="button">✕</button>
    </div>
    <div class="aap-body">
      <div class="aap-field">
        <label class="aap-label">Title</label>
        <input id="aap-album-title" class="aap-input" placeholder="Album title…">
      </div>
      <div class="aap-field">
        <label class="aap-label">Artist</label>
        <input id="aap-artist" class="aap-input" placeholder="Artist name…">
      </div>
      <div class="aap-field">
        <label class="aap-label">Year</label>
        <input id="aap-year" class="aap-input" type="number" min="1900" max="2099">
      </div>
      <div class="aap-art-row">
        <div class="aap-art-preview" id="aap-art-preview">🎵</div>
        <div class="aap-field" style="flex:1">
          <label class="aap-label">Album art URL</label>
          <input id="aap-art" class="aap-input" placeholder="https://…">
        </div>
      </div>
      <div class="aap-field">
        <label class="aap-label">Listen link <span style="color:var(--text3);font-weight:300">(optional)</span></label>
        <input id="aap-audio" class="aap-input" placeholder="Spotify, YouTube, SoundCloud, or .mp3 URL…">
      </div>
      <div class="aap-field">
        <label class="aap-label">Tagline <span style="color:var(--text3);font-weight:300">(optional)</span></label>
        <input id="aap-tagline" class="aap-input" placeholder="One-line take…">
      </div>
      <div class="aap-field">
        <label class="aap-label">Review blurb <span style="color:var(--text3);font-weight:300">(optional)</span></label>
        <textarea id="aap-review" class="aap-textarea" rows="5" placeholder="Write a few sentences — what makes this album stand out this year…"></textarea>
      </div>
    </div>
    <div class="aap-footer">
      <button class="aap-btn aap-btn-danger" id="aap-delete-btn" type="button" style="display:none">Delete</button>
      <div style="flex:1"></div>
      <button class="aap-btn aap-btn-secondary" id="aap-cancel-btn" type="button">Cancel</button>
      <button class="aap-btn aap-btn-primary" id="aap-save-btn" type="button">Save</button>
    </div>
  </div>

  <!-- This page has its own album store; data.js belongs to the timeline. -->
  <script src="bestof-data.js?v=82b6d97919"></script>
  <script src="best-of-year.js?v=1735528add"></script>
</body>
</html>
