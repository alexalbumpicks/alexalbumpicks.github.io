<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The published reader. editor.html is the editing page and is not deployed; the two share
     bestof-data.js and best-of-year.css, but this one loads bestof-reader.js instead.

     The old page carried three http-equiv no-cache metas. They are dropped rather than copied:
     browsers largely ignore them for this purpose, and the ?v= content hashes below are what
     actually busts a stale cache. Re-run tools/stamp.py after editing any css or js. -->
<title>Alex's Album Picks — Best Albums of the Year</title>
<meta name="description" content="A year-by-year ranking of my favourite albums.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Bebas+Neue&family=DM+Mono:wght@300;400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="best-of-year.css?v=c5f1135247">
</head>
<body>
  <div class="year-page">
    <header class="year-hero">
      <!-- No back-link: the timeline is not published, and this page is the site root.
           No hero-actions either - the edit / add / export buttons belong to editor.html. -->
      <div class="hero-kicker">Alex's Album Picks</div>
      <h1 id="year-title">Best Albums of the Year</h1>
      <p class="hero-dek" id="year-dek"></p>
    </header>

    <nav class="year-nav" id="year-nav" aria-label="Browse years"></nav>

    <main class="year-main">
      <section class="year-list" id="year-list"></section>
      <aside class="year-sidebar">
        <div class="sidebar-card">
          <div class="sidebar-label">How this ranking works</div>
          <p id="ranking-note"></p>
        </div>
      </aside>
    </main>
  </div>

  <div id="mini-player">
    <div id="mini-player-bar">
      <span style="font-size:12px;color:#1db954;flex-shrink:0">♪</span>
      <div id="mini-player-title"></div>
      <button id="mini-player-close" type="button" title="Close">✕</button>
    </div>
    <iframe id="mini-player-iframe" src="" height="80"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      style="width:100%;display:block;border:none"></iframe>
    <audio id="mini-player-audio" controls
      style="width:100%;display:none;background:#121212;height:44px;outline:none"></audio>
  </div>

  <!-- The add/edit album modal that sits here on editor.html is absent, not hidden. -->

  <script src="bestof-data.js?v=82b6d97919"></script>
  <script src="bestof-reader.js?v=1b4bbd8b8d"></script>
</body>
</html>
